{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jays Assist — Create account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand-lockup">
        <div class="brand-mark">J</div>
        <div><strong>Jays Assist</strong><span>Your focused AI workspace</span></div>
      </div>
      <div class="auth-heading">
        <p class="eyebrow">GET STARTED</p>
        <h1>Create your workspace.</h1>
        <p>A simple place for your conversations, ideas and questions.</p>
      </div>
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="registerUsername">Username</label>
          <input class="form-control app-input" id="registerUsername" name="username" autocomplete="username" minlength="3" maxlength="150" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerEmail">Email <span class="optional">optional</span></label>
          <input class="form-control app-input" id="registerEmail" name="email" type="email" autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerPassword">Password</label>
          <input class="form-control app-input" id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerPassword2">Confirm password</label>
          <input class="form-control app-input" id="registerPassword2" name="password2" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div id="registerError" class="form-error d-none" role="alert"></div>
        <button class="btn primary-btn w-100" type="submit" id="registerBtn">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login/">Sign in</a></p>
    </section>
  </main>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
