{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jays Assist — Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand-lockup">
        <div class="brand-mark">J</div>
        <div><strong>Jays Assist</strong><span>Your focused AI workspace</span></div>
      </div>
      <div class="auth-heading">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Continue your work.</h1>
        <p>Sign in to continue your conversations.</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control app-input" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control app-input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="form-error d-none" role="alert"></div>
        <button class="btn primary-btn w-100" type="submit" id="loginBtn">Sign in</button>
      </form>
      <p class="auth-switch">New to Jays Assist? <a href="/register/">Create an account</a></p>
    </section>
  </main>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
